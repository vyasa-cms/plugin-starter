[package]
name = "my-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Vyasa plugin, started from vyasa-cms/plugin-starter"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
